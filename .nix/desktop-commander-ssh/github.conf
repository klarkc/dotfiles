# Explicit, service-only policy for Git operations on github.com.
# Use only when the SSH shim has verified the narrow namespace compatibility case.
Host github.com
    HostName github.com
    User git
    Port 22
    BatchMode yes
    StrictHostKeyChecking yes
    UpdateHostKeys no
    ForwardAgent no
    ForwardX11 no
    ClearAllForwardings yes
