name: "Test"
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3.8.2
        with:
          extra-config: accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v5
      - uses: DeterminateSystems/flake-checker-action@v12
        with:
          fail-mode: true
      # `make test` is the standard verification entrypoint for this
      # repo. It runs `nix flake check` plus `.local/bin/*-smoke-test`
      # scripts; the smoke tests are skipped in CI because they need
      # live Atlassian credentials that GitHub does not provide. Local
      # developers run `make test` with the smoke tests enabled by
      # sourcing ~/.profile_override first.
      - run: SKIP_SMOKE=1 make test
